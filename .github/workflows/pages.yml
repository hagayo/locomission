name: Publish mobile to GitHub Pages
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locomission-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate public build configuration
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
          CLERK_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "Set VITE_API_BASE_URL to your HTTPS Render API in GitHub Variables"; exit 1 ;;
          esac
          case "$CLERK_KEY" in
            pk_test_*|pk_live_*) ;;
            *) echo "Set VITE_CLERK_PUBLISHABLE_KEY in GitHub Variables"; exit 1 ;;
          esac
          case "$API_URL$CLERK_KEY" in
            *REPLACE*|*YOUR_*) echo "Placeholder variables are not allowed"; exit 1 ;;
          esac
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build project site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: /locomission/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
      - id: deployment
        uses: actions/deploy-pages@v4
