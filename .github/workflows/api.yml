name: API checks
on:
  push:
    paths: ["api/**", "db/**", "mobile/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "db/**", "mobile/**", ".github/workflows/api.yml"]
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: locomission_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d locomission_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/locomission_test
      LOCOMISSION_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/locomission_test
      REDIS_URL: redis://localhost:6379/0
      LOCOMISSION_DEV_MODE: "true"
      LOCOMISSION_DEV_PLAYER_ID: "ee445be0-e611-4eac-8b79-12f143fbcd18"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint Python
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: Unit and PostGIS/Redis integration tests
        run: python -m pytest -q

  mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check src/main.js
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build mobile preview without secrets
        run: npm run build
