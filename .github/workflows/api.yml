name: API checks
on:
  push:
    paths: ["api/**", "db/**", "content/**", "docs/**", "mobile/**", "README.md", "Dockerfile", ".dockerignore", ".gitignore", "render.yaml", ".github/workflows/*.yml"]
  pull_request:
    paths: ["api/**", "db/**", "content/**", "docs/**", "mobile/**", "README.md", "Dockerfile", ".dockerignore", ".gitignore", "render.yaml", ".github/workflows/*.yml"]
jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: locomission_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d locomission_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/locomission_test
      LOCOMISSION_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/locomission_test
      REDIS_URL: redis://localhost:6379/0
      LOCOMISSION_DEV_MODE: "true"
      LOCOMISSION_DEV_PLAYER_ID: "ee445be0-e611-4eac-8b79-12f143fbcd18"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install Python 3.12 through UV
        run: uv python install 3.12
      - name: Verify committed uv.lock and rebuild project .venv
        run: |
          uv lock --check
          uv sync --locked
          uv tree --locked --depth 1
      - name: Lint Python
        run: uv run --locked ruff check src tests
      - name: Compile
        run: uv run --locked python -m compileall -q src
      - name: Validate unapproved historical mission catalog
        run: uv run --locked python -m locomission.catalog --file ../content/tel-aviv-pilot-drafts.json
      - name: Verify safe operator CLI availability
        run: |
          uv run --locked python -m locomission.live_checks --help
          uv run --locked python -m locomission.pilot --help
      - name: Unit and PostGIS/Redis integration tests
        run: uv run --locked python -m pytest -q --ignore=tests/test_load.py
      - name: Measured Redis load and lease recovery smoke
        run: uv run --locked python -m pytest -q -s tests/test_load.py
      - name: Build API Docker image from repository root
        working-directory: .
        run: docker build --tag locomission-api:ci .
      - name: Check packaged Python and migration CLI
        working-directory: .
        run: |
          docker run --rm --entrypoint python locomission-api:ci -m locomission.migrate --help
          docker run --rm --entrypoint python locomission-api:ci -c "import locomission.main"
      - name: Start packaged API with isolated CI services
        working-directory: .
        run: |
          docker run -d --name locomission-api-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e LOCOMISSION_ENV=local \
            -e LOCOMISSION_DEV_MODE=false \
            -e PORT=8080 locomission-api:ci
      - name: Smoke-test Dockerized API readiness
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 1
          done
          echo "API Docker container failed readiness" >&2
          exit 1
      - name: Stop packaged API
        if: always()
        working-directory: .
        run: docker rm --force locomission-api-ci || true

  mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/apiClient.js
          node --check src/profile.js
          node --check src/proofRecovery.js
      - name: Frontend recovery tests
        run: npm test
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium end-to-end gameplay tests
        run: npm run test:e2e
      - name: Build GitHub Pages site layout without credentials
        run: |
          VITE_BASE_PATH=/locomission/ npm run build
          grep -q '/locomission/assets/' dist/index.html
          grep -q 'href="./privacy.html"' dist/index.html
          test -f dist/privacy.html

  windows-uv:
    # Verifies uv.lock and a fresh .venv on Windows. No external services,
    # credentials, application deployment or gameplay logic changes.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Create Windows Python 3.12 environment
        run: |
          uv python install 3.12
          uv lock --check
          uv sync --locked
      - name: Verify Python imports and Windows unit tests
        run: |
          uv run --locked python -c "import fastapi, redis, psycopg, httpx, PIL, clerk_backend_api"
          uv run --locked python -m pytest -q tests/test_config.py tests/test_domain.py tests/test_clerk_auth.py tests/test_vision.py tests/test_catalog.py tests/test_editorial.py tests/test_live_checks.py tests/test_pilot.py tests/test_uv_tooling.py
