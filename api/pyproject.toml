[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "locomission-api"
version = "0.1.0"
description = "LocoMission first vertical slice: location-aware history missions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.18,<1",
  "clerk-backend-api>=6,<9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
