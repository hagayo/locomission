[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "locomission-api"
version = "0.1.0"
description = "LocoMission first vertical slice: location-aware history missions"
requires-python = ">=3.12"
dependencies = [
    "clerk-backend-api>=6,<9",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5,<7",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
